apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: knowledge-assistant
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: knowledge-assistant
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 8501
      targetPort: http
  type: ClusterIP
