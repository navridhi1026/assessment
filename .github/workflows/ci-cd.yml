name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q backend frontend tests
      - run: python -m pytest -q
      - uses: azure/setup-kubectl@v4
      - name: Validate Kubernetes manifests
        run: kubectl kustomize .

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image and publish on main
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_K8S_DEPLOY == 'true'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster credentials
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG_DATA" || (echo "KUBE_CONFIG secret is required when ENABLE_K8S_DEPLOY=true" >&2; exit 1)
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Configure image and deployment secrets
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          test -n "$GRAFANA_PASSWORD" || (echo "GRAFANA_ADMIN_PASSWORD secret is required" >&2; exit 1)
          test -n "$GHCR_PULL_TOKEN" || (echo "GHCR_PULL_TOKEN secret with read:packages permission is required" >&2; exit 1)
          sed -i "s|enterprise-ai-knowledge-assistant:local|$IMAGE|g" kubernetes/deployment.yaml
          kubectl create namespace knowledge-assistant --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic grafana-admin --namespace knowledge-assistant \
            --from-literal=password="$GRAFANA_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull --namespace knowledge-assistant \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" \
            --docker-password="$GHCR_PULL_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default --namespace knowledge-assistant \
            --type merge -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'
      - name: Apply application, Ollama, and observability manifests
        run: kubectl apply -k .
      - name: Verify deployment rollouts
        run: |
          kubectl rollout status deployment/backend -n knowledge-assistant --timeout=900s
          kubectl rollout status deployment/frontend -n knowledge-assistant --timeout=300s
          kubectl rollout status deployment/ollama -n knowledge-assistant --timeout=900s
          kubectl rollout status deployment/prometheus -n knowledge-assistant --timeout=300s
          kubectl rollout status deployment/loki -n knowledge-assistant --timeout=300s
          kubectl rollout status deployment/grafana -n knowledge-assistant --timeout=300s
          kubectl rollout status daemonset/promtail -n knowledge-assistant --timeout=300s
